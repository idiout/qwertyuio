name: Build IPA

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project GameRemote.xcodeproj \
            -scheme GameRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/GameRemote.app" Payload/
          codesign --force --deep -s - Payload/GameRemote.app || true
          zip -r GameRemote.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameRemote-ipa
          path: GameRemote.ipa
